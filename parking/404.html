<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="description" content="Cette page Trouvable n’est pas disponible pendant la pause du service." />
        <meta name="color-scheme" content="dark" />
        <title>Page indisponible — Trouvable</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #080808;
                color: #f7f7f7;
            }
            * {
                box-sizing: border-box;
            }
            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: radial-gradient(circle at 20% 0%, rgba(91, 115, 255, 0.2), transparent 34rem), #080808;
            }
            main {
                width: min(100%, 680px);
                padding: clamp(32px, 7vw, 64px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 24px;
                background: rgba(15, 15, 15, 0.92);
                box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            }
            .eyebrow {
                margin: 0 0 18px;
                color: #8ea0ff;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }
            h1 {
                margin: 0;
                font-size: clamp(2rem, 7vw, 4rem);
                line-height: 1.02;
                letter-spacing: -0.04em;
            }
            p {
                margin: 24px 0 0;
                max-width: 54ch;
                color: #b8b8b8;
                font-size: clamp(1rem, 2.5vw, 1.125rem);
                line-height: 1.7;
            }
            a {
                display: inline-flex;
                margin-top: 32px;
                min-height: 44px;
                align-items: center;
                border: 1px solid rgba(142, 160, 255, 0.5);
                border-radius: 999px;
                padding: 0 20px;
                color: #eef0ff;
                text-decoration: none;
            }
            a:focus-visible {
                outline: 2px solid #8ea0ff;
                outline-offset: 4px;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="eyebrow">Erreur 404</p>
            <h1>Cette page n’est pas disponible.</h1>
            <p>Trouvable est temporairement en pause et ne traite aucune nouvelle opération.</p>
            <a href="/">Revenir à l’accueil</a>
        </main>
    </body>
</html>
